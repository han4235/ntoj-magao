<style>
  .dtoj-page,
  .dtoj-skin {
    --ink: #1c2833;
    --ink-2: #3e4c59;
    --muted: #3e4c59;
    --accent: #2f5d82;
    --wash: #f4f7f8;
    --note: #e7f0f6;
    --note-ink: #143044;
    --line: #d5dde4;
    --s1: 4px;
    --s2: 8px;
    --s3: 12px;
    --s4: 16px;
    --s5: 24px;
    --s6: 32px;
    /* 全站代码字体。JetBrains Mono 跟着 ui-default 打包（@fontsource），
       Windows 和 Mac 出来的字形一样；系统里的 Consolas 只有 Windows 有，
       Mac 会退到 Courier New，细得像打字机，所以不用它。
       连字在下面的代码规则里关掉，`<=` 要按两个字符显示。 */
    --dtoj-code-font: "JetBrains Mono", "Cascadia Code", ui-monospace, monospace;
    color: var(--ink);
    font-size: 1rem;
    line-height: 1.65;
  }
  /* 代码块：pre 和它里面的 code 一起定字体。prism 主题单独给
     code[class*=language-] 设了字体，只改 pre 的话题解里的代码还是旧字形。
     连字关掉，`<=` 不能被画成一个 `≤`。 */
  .dtoj-page pre,
  .dtoj-page pre code,
  .dtoj-page :not(pre) > code,
  .dtoj-skin pre,
  .dtoj-skin pre code,
  .dtoj-skin :not(pre) > code {
    font-family: var(--dtoj-code-font);
    font-variant-ligatures: none;
    font-feature-settings: "calt" 0, "liga" 0;
  }
  body:has(.dtoj-page),
  body:has(.dtoj-skin),
  body:has(.dtoj-page) .slideout-panel,
  body:has(.dtoj-skin) .slideout-panel,
  body:has(.dtoj-page) .main,
  body:has(.dtoj-skin) .main,
  .dtoj-page,
  .dtoj-skin { background: var(--wash); }
  .dtoj-page .section,
  .dtoj-page .section__body,
  .dtoj-skin .section,
  .dtoj-skin .section__body { background: transparent; }
  .dtoj-page { display: flex; flex-direction: column; gap: var(--s6); }
  .dtoj-page ::selection,
  .dtoj-skin ::selection { background: #d5e4f0; color: var(--ink); }
  .dtoj-page :focus-visible,
  .dtoj-skin :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dtoj-page > .section,
  .dtoj-skin .section { margin: 0; }
  .dtoj-page .section__title,
  .dtoj-skin .section__title {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .dtoj-hero { display: flex; justify-content: space-between; gap: var(--s4); align-items: flex-end; flex-wrap: wrap; }
  .dtoj-hero h2 { margin: 0 0 var(--s2); font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
  .dtoj-hero-copy { max-width: 68ch; }
  .dtoj-brand { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 var(--s2); }
  .dtoj-muted { color: var(--muted); margin: 0; }
  .dtoj-check { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); }
  .dtoj-block { display: flex; flex-direction: column; gap: var(--s2); }
  .dtoj-block > h2 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
  .dtoj-quiet > .dtoj-activity-title {
    margin: 0;
    color: var(--ink);
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .dtoj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--s3); }
  .dtoj-grid--paths { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dtoj-scroll { display: flex; gap: var(--s3); overflow-x: auto; padding-bottom: var(--s2); scrollbar-color: #8aa0b3 transparent; }
  .dtoj-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: var(--s3) var(--s4);
    background: #fff;
    color: inherit;
    text-decoration: none;
  }
  a.dtoj-card:hover { border-color: var(--accent); }
  .dtoj-card h2, .dtoj-card h3 { margin: 0 0 var(--s1); font-size: 1.125rem; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em; }
  .dtoj-lead .dtoj-card h3 { font-size: 1.25rem; font-weight: 700; }
  .dtoj-quiet .dtoj-card { background: #fff; padding: var(--s2) var(--s3); }
  .dtoj-quiet .dtoj-card h2, .dtoj-quiet .dtoj-card h3 { font-size: 1rem; font-weight: 600; }
  .dtoj-scroll .dtoj-card { flex: 0 0 240px; }
  .dtoj-feature { border-color: var(--accent); }
  .dtoj-static { cursor: default; }
  .dtoj-feed { display: flex; flex-direction: column; gap: var(--s3); }
  .dtoj-chips { display: flex; flex-wrap: wrap; gap: var(--s2); margin: 0; }
  .dtoj-chip {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: var(--s2) var(--s3);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    text-decoration: none;
  }
  .dtoj-chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .dtoj-label { margin: var(--s3) 0 0; font-size: 0.875rem; font-weight: 700; line-height: 1.4; }
  .dtoj-meta { color: var(--muted); font-size: 0.875rem; line-height: 1.45; margin: var(--s1) 0; }
  .section__body.no-padding > .dtoj-note { margin: var(--s3) var(--s4); }
  .dtoj-note {
    margin: 0 0 var(--s3);
    padding: var(--s2) var(--s3);
    background: var(--note);
    color: var(--note-ink);
    border-radius: 8px;
    max-width: 68ch;
  }
  .dtoj-prose { max-width: 68ch; }
  .dtoj-prose h2 { margin: var(--s4) 0 var(--s2); font-size: 1.125rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
  .dtoj-prose h2:first-child { margin-top: 0; }
  .dtoj-prose p { margin: 0 0 var(--s3); }
  .dtoj-tree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s1); }
  .dtoj-tree a {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: var(--s2) var(--s3);
    border-radius: 8px;
    text-decoration: none;
  }
  .dtoj-tree a.on { background: var(--note); color: var(--note-ink); font-weight: 700; }
  .dtoj-num { font-size: 1.5rem; font-weight: 700; line-height: 1.1; margin: 0; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .dtoj-quiet .dtoj-num { font-size: 1.25rem; }
  .dtoj-tag { display: inline-block; margin: 0 var(--s1) var(--s1) 0; padding: 0 var(--s2); border-radius: 4px; background: var(--wash); font-size: 0.875rem; }
  .dtoj-table-scroll { overflow-x: auto; }
  .dtoj-page .data-table,
  .dtoj-skin .data-table { font-variant-numeric: tabular-nums; }
  .dtoj-status, .dtoj-level { display: inline-block; padding: 0 var(--s2); border-radius: 4px; font-weight: 600; }
  .dtoj-status[data-status="pass"] { background: #e5f2ea; color: #145c32; }
  .dtoj-status[data-status="progress"],
  .dtoj-status[data-status="pending"] { background: #f8f1dc; color: #6a4b00; }
  .dtoj-status[data-status="fail"] { background: #f8e6e6; color: #8a1f1f; }
  .dtoj-status a { color: inherit; text-decoration: none; }
  .dtoj-level[data-level="入门"] { background: #e5f2ea; color: #145c32; }
  .dtoj-level[data-level="普及"] { background: #e7f0f6; color: #143044; }
  .dtoj-level[data-level="提高"] { background: #f8f1dc; color: #6a4b00; }
  .dtoj-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s3) var(--s4); margin: 0 0 var(--s4); }
  .dtoj-facts div { display: flex; flex-direction: column; gap: var(--s1); }
  .dtoj-facts dt { margin: 0; font-size: 0.875rem; font-weight: 700; color: var(--muted); }
  .dtoj-facts dd { margin: 0; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
  .dtoj-chapters { margin: var(--s2) 0 0; padding-left: 1.25rem; display: flex; flex-direction: column; gap: var(--s2); max-width: 40rem; }
  .dtoj-announce { display: flex; flex-direction: column; gap: var(--s4); }
  .dtoj-announce h3 { margin: 0 0 var(--s1); font-size: 1.125rem; font-weight: 600; }
  .dtoj-announce p { margin: 0; max-width: 68ch; }
  .dtoj-page pre:not(.dtoj-record-code),
  .dtoj-skin pre:not(.dtoj-record-code) {
    font-family: var(--dtoj-code-font);
    font-size: 0.9375rem;
    line-height: 1.5;
    background: var(--wash);
    color: var(--ink);
    padding: var(--s3) var(--s4);
    border-radius: 8px;
    overflow-x: auto;
    max-width: 68ch;
  }
  .dtoj-page button:disabled,
  .dtoj-page input:disabled,
  .dtoj-skin button:disabled,
  .dtoj-skin input:disabled { cursor: not-allowed; }
  .dtoj-back { margin: var(--s4) 0 0; }
  .dtoj-library { margin: 0; font-size: 0.875rem; }
  .dtoj-skin .dtoj-library { margin-top: var(--s4); }
  .dtoj-library a { color: var(--accent); }
  @media (max-width: 1100px) {
    .nav__item { padding-left: 10px; padding-right: 10px; }
  }
  @media (max-width: 800px) {
    .dtoj-grid--paths { grid-template-columns: 1fr 1fr; }
    .dtoj-brand { font-size: 1.5rem; }
  }
  @media (max-width: 520px) {
    .dtoj-grid,
    .dtoj-grid--paths { grid-template-columns: 1fr; }
  }

  body:has(.dtoj-home),
  body:has(.dtoj-home) .slideout-panel,
  body:has(.dtoj-home) .main {
    background-color: #e8eef5;
    background-image:
      radial-gradient(ellipse 70% 42% at 0% -8%, rgba(37, 99, 235, 0.16), transparent 58%),
      radial-gradient(ellipse 55% 36% at 100% 0%, rgba(148, 163, 184, 0.28), transparent 52%),
      linear-gradient(rgba(30, 41, 59, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30, 41, 59, 0.035) 1px, transparent 1px);
    background-size: auto, auto, 56px 56px, 56px 56px;
  }
  .dtoj-home {
    --ink: #111827;
    --muted: #5f6b7a;
    --brand: #2563eb;
    --brand-deep: #1e40af;
    --mint: #6fa7b3;
    --gold: #bfa46a;
    --gold-deep: #8e7341;
    --line: rgba(30, 41, 59, 0.09);
    background: transparent;
    color: var(--ink);
    font-family: "Open Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .dtoj-shell { width: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; align-self: stretch; }
  .dtoj-page-head h1 {
    margin: 0;
    color: var(--ink);
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 760;
    letter-spacing: -0.04em;
    line-height: 1.16;
  }
  .dtoj-page-head p { margin: 8px 0 0; max-width: 42rem; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .dtoj-sheet {
    overflow: auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .dtoj-sheet table { width: 100%; min-width: 640px; border-collapse: collapse; }
  .dtoj-sheet th, .dtoj-sheet td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 14px;
    background: transparent;
  }
  .dtoj-sheet th { color: var(--muted); font-size: 12px; font-weight: 700; }
  .dtoj-sheet tr:last-child td { border-bottom: 0; }
  .dtoj-sheet a { color: var(--ink); font-weight: 700; text-decoration: none; }
  .dtoj-sheet-pad { padding: 16px 18px; }
  .dtoj-sheet .dtoj-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .dtoj-home form.dtoj-sheet-pad .dtoj-actions {
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .dtoj-home form.dtoj-sheet-pad .dtoj-actions .dtoj-go,
  .dtoj-home form.dtoj-sheet-pad .dtoj-actions .dtoj-alt {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: auto;
    min-width: 104px;
    height: 44px;
    padding: 0 24px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
  }
  .dtoj-home form.dtoj-sheet-pad .dtoj-actions button.dtoj-go {
    margin: 0;
    border: 0;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    color: var(--brand-deep);
    background: #fff;
    box-shadow: none;
  }
  .dtoj-home form.dtoj-sheet-pad .dtoj-actions button.dtoj-go:hover {
    background: #f4f7fb;
    transform: translateY(-1px);
  }
  .dtoj-home form.dtoj-sheet-pad .dtoj-actions .dtoj-alt {
    color: var(--brand-deep);
    background: #fff;
    border: 1px solid #c5d4e8;
    box-shadow: none;
  }
  .dtoj-home form.dtoj-sheet-pad .dtoj-actions .dtoj-alt:hover {
    background: #f4f7fb;
    border-color: #a8bdd4;
    transform: translateY(-1px);
  }
  .dtoj-entry {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fff;
    color: inherit;
    text-decoration: none;
  }
  .dtoj-entry h2, .dtoj-entry h3 {
    margin: 0;
    color: var(--ink);
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
    font-size: 22px;
    font-weight: 760;
    letter-spacing: -0.03em;
  }
  .dtoj-entry p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .dtoj-split { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 800px) { .dtoj-split { grid-template-columns: 1fr; } }
  .dtoj-hero-card {
    position: relative;
    overflow: hidden;
    margin: 0;
    max-width: none;
    width: 100%;
    display: block;
    text-align: center;
    padding: 32px 36px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    border-radius: 30px;
    box-shadow: 0 16px 40px rgba(28, 39, 64, 0.07);
  }
  .dtoj-hero-card.has-photo {
    background-size: cover;
    background-position: center;
  }
  .dtoj-hero-card .dtoj-font-sans { font-family: "Open Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .dtoj-hero-card .dtoj-font-yahei { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .dtoj-hero-card .dtoj-font-hei { font-family: "PingFang SC", "Heiti SC", "Hiragino Sans GB", sans-serif; }
  .dtoj-hero-card .dtoj-font-song { font-family: "Songti SC", "Noto Serif SC", serif; }
  .dtoj-hero-card .dtoj-font-serif { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; }
  .dtoj-hero-card .dtoj-font-fangsong { font-family: "Noto Serif SC", "Songti SC", serif; }
  .dtoj-hero-card .dtoj-font-kai { font-family: "Source Han Serif SC", "Songti SC", serif; }
  .dtoj-hero-card .dtoj-font-round { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
  .dtoj-hero-card .dtoj-font-display { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; font-weight: 700; }
  .dtoj-hero-card .dtoj-font-mono { font-family: "JetBrains Mono", "Cascadia Code", ui-monospace, monospace; }
  .dtoj-kicker {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
  }
  .dtoj-display {
    margin: 0;
    color: var(--brand);
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.055em;
  }
  .dtoj-tagline { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
  .dtoj-range {
    margin: 10px 0 28px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
  }
  .dtoj-hero-card .dtoj-actions {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 760px;
    margin: 0 auto;
  }
  .dtoj-hero-card .dtoj-go,
  .dtoj-hero-card .dtoj-alt { flex: 1 1 180px; max-width: 240px; }
  /* 首页作业提醒条（只在有待认领作业时渲染）：深褐小喇叭 + 暖底色，和满屏蓝拉开 */
  .dtoj-notice {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 13px 20px;
    border-radius: 16px;
    background: #f8f1dc;
    box-shadow: 0 12px 28px rgba(142, 115, 65, 0.16);
    color: #6a4b00;
    text-decoration: none;
  }
  .dtoj-notice:hover { background: #f6ebcd; color: #553c00; }
  .dtoj-notice-ico {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 999px;
    background: #6a4b00;
    color: #f8f1dc;
  }
  .dtoj-notice-track { flex: 1 1 auto; min-width: 0; overflow-x: auto; }
  .dtoj-notice-lane { display: flex; width: max-content; }
  .dtoj-notice-text {
    flex: 0 0 auto;
    margin: 0;
    padding-right: 72px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.8;
    white-space: nowrap;
  }
  .dtoj-notice-text b { font-size: 15px; font-weight: 800; }
  .dtoj-notice.is-scroll .dtoj-notice-track { overflow: hidden; }
  .dtoj-notice.is-scroll .dtoj-notice-lane { animation: dtoj-notice-roll var(--dtoj-notice-duration, 18s) linear infinite; }
  .dtoj-notice:hover .dtoj-notice-lane { animation-play-state: paused; }
  @keyframes dtoj-notice-roll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dtoj-notice.is-scroll .dtoj-notice-lane { animation: none; }
  }
  .dtoj-go, .dtoj-alt, .dtoj-sign {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
  }
  .dtoj-go {
    color: #fff;
    background: linear-gradient(110deg, var(--brand), var(--mint));
    box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
  }
  .dtoj-go.dtoj-hero-grad-brand { background: linear-gradient(110deg, var(--brand), var(--mint)); box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18); }
  .dtoj-go.dtoj-hero-grad-teal { background: linear-gradient(110deg, #0d9488, #2dd4bf); box-shadow: 0 10px 24px rgba(13, 148, 136, 0.2); }
  .dtoj-go.dtoj-hero-grad-ocean { background: linear-gradient(110deg, #1e40af, #38bdf8); box-shadow: 0 10px 24px rgba(30, 64, 175, 0.2); }
  .dtoj-go.dtoj-hero-grad-sunset { background: linear-gradient(110deg, #ea580c, #fbbf24); box-shadow: 0 10px 24px rgba(234, 88, 12, 0.2); }
  .dtoj-go.dtoj-hero-grad-rose { background: linear-gradient(110deg, #e11d48, #fb7185); box-shadow: 0 10px 24px rgba(225, 29, 72, 0.2); }
  .dtoj-go.dtoj-hero-grad-violet { background: linear-gradient(110deg, #7c3aed, #a78bfa); box-shadow: 0 10px 24px rgba(124, 58, 237, 0.2); }

  body.dtoj-group-dialog-open { overflow: hidden; }
  .dtoj-group-dialog {

    --line: rgba(30, 41, 59, 0.09);

  .dtoj-group-dialog[hidden] { display: none; }

  .dtoj-group-dialog__panel {
    position: relative;
    display: flex;
    flex-direction: column;
    /* 520px：名单要并排放得下姓名和账号两列，420px 会把账号挤到行尾之外 */
    width: min(520px, calc(100vw - 32px));
    /* 两行是有意的：老浏览器认 vh，认 dvh 的用 dvh，免得手机地址栏吃掉高度 */
    max-height: min(640px, calc(100vh - 64px));

  .dtoj-group-dialog__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 0; flex: none; }
  .dtoj-group-dialog__head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .dtoj-group-dialog__close {

  .dtoj-group-dialog__close:hover { background: #f1f5f9; color: var(--ink); }
  .dtoj-group-dialog__hint { margin: 10px 20px 0; color: var(--muted); font-size: 13px; line-height: 1.7; flex: none; }
  /* 表单是滚动容器：分组多了只滚列表，头和按钮钉住 */
  .dtoj-group-dialog__panel form { display: flex; flex-direction: column; min-height: 0; }
  /* 建组人筛选：一排胶囊。横向滚动而不是换行，免得创建者多了把列表挤没 */
  .dtoj-group-dialog__creators {
    display: flex;
    gap: 6px;
    flex: none;
    margin-top: 12px;
    padding: 0 20px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .dtoj-group-dialog__creator {
    flex: none;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .dtoj-group-dialog__creator:hover { border-color: rgba(37, 99, 235, 0.35); color: var(--ink); }
  .dtoj-group-dialog__creator.is-on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .dtoj-group-dialog__creator:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3); }
  /* 输入框（新建组名 / 搜组员）。选择器故意写到两级：
     theme 的 `input[type=search]{box-sizing:content-box}` 是 (0,1,1)，单类名压不住。
     必须写 flex:none —— 表单是等比收缩的 flex 容器，默认 flex-shrink:1 会把 38px 压成 18px 的细条。
     也不写 width:100%：靠 align-self 拉满、只留 20px 外边距，就不会顶出面板。 */
  .dtoj-group-dialog .dtoj-group-dialog__search,
  .dtoj-group-dialog .dtoj-group-dialog__input {
    flex: none;
    box-sizing: border-box;
    height: 38px;
    margin: 12px 20px 0;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 400;
    caret-color: var(--brand);
  }
  .dtoj-group-dialog .dtoj-group-dialog__search { background: #f8fafc; }
  .dtoj-group-dialog .dtoj-group-dialog__input { background: #fff; }
  /* placeholder 取 --muted（浅底上 5.19:1）：本套令牌里没有比它更浅、又能过 4.5:1 的文字色 */
  .dtoj-group-dialog .dtoj-group-dialog__search::placeholder,
  .dtoj-group-dialog .dtoj-group-dialog__input::placeholder { color: var(--muted); }
  .dtoj-group-dialog .dtoj-group-dialog__search:focus,
  .dtoj-group-dialog .dtoj-group-dialog__input:focus {
    outline: none;
    border-color: var(--brand);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
  }
  /* 计数行：勾选的人数和总数。列表本身不说话，得由它告诉用户选了几个 */
  .dtoj-group-dialog__count {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex: none;
    margin: 12px 20px 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .dtoj-group-dialog__count b { color: var(--brand-deep); font-size: 13px; font-weight: 800; }
  /* 名单是一张清单，不是一叠卡片：
     几十个各自描边的圆角盒子会砌成一堵墙；靠悬停底色和选中染色分区，比描边轻得多。 */
  .dtoj-group-dialog__list {
    display: flex;
    flex-direction: column;
    /* 2px 缝：勾选行是 8px 圆角，上下贴死时相邻两块浅底会在接缝处留下缺口 */
    gap: 2px;
    flex: 1;
    min-height: 0;
    margin: 10px 20px 0;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(30, 41, 59, 0.22) transparent;
  }
  .dtoj-group-dialog__list::-webkit-scrollbar { width: 10px; }
  .dtoj-group-dialog__list::-webkit-scrollbar-thumb {
    border: 3px solid #fff;
    border-radius: 999px;
    background: rgba(30, 41, 59, 0.22);
  }
  .dtoj-group-dialog__list::-webkit-scrollbar-thumb:hover { background: rgba(30, 41, 59, 0.34); }
  /* 一行一个勾选目标，36px 够点又不虚胖。
     选择器必须带一级祖先：theme 里
     `label:not(.quick-input-list-label){display:block}` 的特异性是 (0,1,1)，
     单类名的 .dtoj-group-dialog__item (0,1,0) 压不住，label 一旦是 block，
     勾选框和名字就上下分家，行高被撑到 60px。
     也刻意不用 `__list > __item`：课程弹层把章节行套在课程分组里，
     写死直接子级的话那批行会漏掉这条规则。 */
  .dtoj-group-dialog .dtoj-group-dialog__item {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
    min-height: 36px;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  /* theme 的 `label input{display:block}` 会把勾选框顶成整行，这里按 16px 方框重画。
     边框取 --muted：白底 5.43:1，够到控件边界要求的 3:1，也不用另造灰色 */
  .dtoj-group-dialog__item input[type=checkbox] {
    flex: none;
    display: block;
    box-sizing: border-box;
    width: 16px;
    height: 16px;
    margin: 0;
    border: 1.5px solid var(--muted);
    border-radius: 4px;
    background: #fff;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .dtoj-group-dialog__item input[type=checkbox]:checked {
    border-color: var(--brand);
    background: var(--brand) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3.6 8.4l3 3 5.8-6'/%3E%3C/svg%3E") center/12px no-repeat;
  }
  .dtoj-group-dialog__item:hover { background: #f1f5f9; }
  /* 勾上的整行轻染，扫一眼就知道选了谁 */
  .dtoj-group-dialog__item:has(input:checked) { background: rgba(37, 99, 235, 0.07); }
  .dtoj-group-dialog__item:has(input:checked):hover { background: rgba(37, 99, 235, 0.12); }
  .dtoj-group-dialog__item:has(input:focus-visible) { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); }
  .dtoj-group-dialog__item input[type=checkbox]:focus-visible { outline: none; }
  /* 同上：display:flex 会盖掉 [hidden]，筛选和搜索得显式关掉。
     带祖先是为了压过上面那条同行同级的规则（同为 (0,2,0)，靠来源顺序不稳定）。 */
  .dtoj-group-dialog .dtoj-group-dialog__item[hidden] { display: none; }
  /* 「已经在这一章里」的行：勾是勾着的，但不给改，也不参与提交 */
  .dtoj-group-dialog .dtoj-group-dialog__item:has(input[type=checkbox]:disabled) { cursor: default; }
  .dtoj-group-dialog__item input[type=checkbox]:disabled { cursor: not-allowed; opacity: 0.5; }
  /* 建组人：挤到行尾，压得比组名轻 */
  .dtoj-group-dialog__sub { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 600; font-style: normal; }
  .dtoj-group-dialog__foot { display: flex; justify-content: flex-end; gap: 8px; flex: none; padding: 16px 20px 20px; }
  .dtoj-group-dialog__foot .dtoj-user-btn { min-width: 84px; justify-content: center; }
  @media (prefers-reduced-motion: reduce) {
    .dtoj-group-dialog__item,
    .dtoj-group-dialog__item input[type=checkbox] { transition: none; }
  }

<button type="button" class="dtoj-scroll-top" id="dtoj-scroll-top" hidden aria-label="返回页面顶部">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5 3.5 8h3v4.5h3V8h3L8 3.5z" fill="currentColor"/></svg>
  <span>顶部</span>
</button>
<script>
(function () {
  var TRAINING_STALE_KEY = 'dtoj:training-stale';
  function markTrainingStale() {
    try { sessionStorage.setItem(TRAINING_STALE_KEY, '1'); } catch (e) {}
  }
  function consumeTrainingStale() {
    try { sessionStorage.removeItem(TRAINING_STALE_KEY); } catch (e) {}
  }
  function trainingStale() {
    try { return sessionStorage.getItem(TRAINING_STALE_KEY) === '1'; } catch (e) { return false; }
  }
  function isTrainingListUrl(url) {
    try {
      var u = new URL(url, location.origin);
      return u.pathname === '/training';
    } catch (e) {
      return false;
    }
  }
  function refreshTrainingIfStale(ev) {
    if (!trainingStale()) return;
    var p = location.pathname;
    if (p.indexOf('/training') !== 0 || p === '/training/create' || /\/edit$/.test(p)) return;
    if (p === '/training') {
      consumeTrainingStale();
      location.reload();
      return;
    }
    if (ev && ev.persisted && /^\/training\/[^/]+$/.test(p)) {
      consumeTrainingStale();
      location.reload();
    }
  }
  window.addEventListener('pageshow', refreshTrainingIfStale);
  function fallbackOf(el) {
    return el.getAttribute('data-dtoj-back-fallback')
      || el.getAttribute('data-back')
      || '';
  }
  function stillInEscapeZone(pathname, escapePrefix) {
    if (!escapePrefix) return false;
    if (pathname === '/training/create') return false;
    return pathname.indexOf(escapePrefix) === 0 && pathname !== escapePrefix.replace(/\/$/, '');
  }
  function backWithEscape(fallback, escapePrefix) {
    if (window.history.length <= 1) {
      if (fallback) location.assign(fallback);
      return;
    }
    var guard = 0;
    var max = 30;
    function onPop() {
      guard += 1;
      if (!stillInEscapeZone(location.pathname, escapePrefix) || guard >= max) {
        window.removeEventListener('popstate', onPop);
        if (fallback && (stillInEscapeZone(location.pathname, escapePrefix) || !isTrainingListUrl(location.href))) {
          location.assign(fallback);
        }
        return;
      }
      history.back();
    }
    window.addEventListener('popstate', onPop);
    history.back();
  }
  function trainingReturnUrl() {
    try { return sessionStorage.getItem('dtoj-training-return') || ''; } catch (e) { return ''; }
  }
  function goBackOrAssign(fallback, el) {
    var trainingRet = trainingReturnUrl();
    // 只有那个补出来的「返回课程」才强制指到课程。原先是按容器匹配
    // （#dtoj-problem-back-links / .dtoj-problem-back），于是同一行里
    // 「返回训练」「返回题库」乃至提交页的「返回题目」也一并被拐去课程：
    // 标签写着训练、点下去落在课程，这就是「路径显示错」的来源。
    if (trainingRet && /^\/p\//.test(location.pathname) && el.hasAttribute('data-dtoj-training-back')) {
      location.assign(trainingRet);
      return;
    }
    // 「返回训练」是往上走一层到训练区，标签就是目的地，别走 history.back()：
    // 上一页多半是课程页，落在课程上又和标签对不上。
    if (el.hasAttribute('data-dtoj-training-home')) {
      if (fallback) location.assign(fallback);
      return;
    }
    if (location.hash && history.replaceState) {
      history.replaceState(null, '', location.pathname + location.search);
    }
    if (trainingStale() && fallback && isTrainingListUrl(fallback)) {
      consumeTrainingStale();
      location.assign(fallback);
      return;
    }
    var escapePrefix = el.getAttribute('data-dtoj-back-escape');
    // 「返回题库」这类标签写死了目的地，但默认走 history.back()：
    // 上一页是登录页（隐藏题先跳登录）时，点一下只会回到登录页再被弹回来，
    // 看着就是「点了没反应」。上一页不在同一区块时就直奔目的地。
    var samePrefix = el.getAttribute('data-dtoj-back-same');
    if (samePrefix) {
      var refPath = '';
      try {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin) refPath = ref.pathname;
      } catch (e) {}
      if (!refPath || refPath.indexOf(samePrefix) !== 0) {
        if (fallback) location.assign(fallback);
        return;
      }
    }
    if (escapePrefix && stillInEscapeZone(location.pathname, escapePrefix)) {
      if (fallback && isTrainingListUrl(fallback)) {
        location.assign(fallback);
        return;
      }
      backWithEscape(fallback, escapePrefix);
      return;
    }
    if (window.history.length > 1) {
      history.back();
      return;
    }
    if (fallback) location.assign(fallback);
  }
  document.addEventListener('click', function (ev) {
    var fromTraining = ev.target.closest('[data-dtoj-training-return]');
    if (fromTraining) {
      try {
        sessionStorage.setItem('dtoj-training-return', fromTraining.getAttribute('data-dtoj-training-return') || '');
      } catch (e) {}
    }
    var el = ev.target.closest('[data-dtoj-back-fallback], [data-back]');
    if (!el) return;
    var fallback = fallbackOf(el);
    if (!fallback) return;
    ev.preventDefault();
    goBackOrAssign(fallback, el);
  });
})();
(function () {
  var topBtn = document.getElementById('dtoj-scroll-top');
  if (!topBtn) return;
  function toggleTopBtn() {
    topBtn.hidden = window.scrollY < 240;
  }
  topBtn.addEventListener('click', function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });
  window.addEventListener('scroll', toggleTopBtn, { passive: true });
  toggleTopBtn();
})();
</script>
